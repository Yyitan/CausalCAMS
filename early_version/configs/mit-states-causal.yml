# CausalCAMS - MIT-States 实验配置
# 在原始 mit-states.yml 基础上新增因果超参

model:
  model_name: CausalCAMS          # 使用因果扩展模型
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "ViT-L/14"
  num_units: 32
  m_layers: 8
  adapter_dim: 128

  # ── 因果模块超参 ────────────────────────────────────────────────────────
  use_causal: true              # 总开关（false = 退化为标准 CAMS）
  causal_recon_weight: 0.5      # L_recon 权重 λ₁
  causal_cf_weight: 0.3         # L_cf 权重    λ₂
  cf_hidden_dim: 2048           # Composer MLP 隐层维度（null = 2×D 自动）
  cf_dropout: 0.1               # Composer Dropout
  backdoor_smoothing: 1.0       # 逆频率 Laplace 平滑

train:
  dataset: mit-states
  step_size: 5
  gamma: 0.5
  lr: 0.0001
  train_batch_size: 64
  epochs: 20                    # 比原始多 5 epoch（MIT-States 收敛较慢）
  context_length: 8
  seed: 0
  val_metric: AUC
  save_final_model: True
  save_path: CAMS/weight
  att_loss_weight: 0.5
  obj_loss_weight: 0.5
  com_loss_weight: 1
  glb_loss_weight: 1

test:
  open_world: false
  eval_batch_size: 64
  feasibility: CAMS/feasibilities/feasibility_mit.pt
  threshold: 0.3625205941
  threshold_trials: 50
  beta: 0.85
  load_model: false
