# CausalCAMS - UT-Zappos50K 实验配置

model:
  model_name: CausalCAMS
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "./lyt/czsl/CLIP-main/ViT-L-14.pt"
  num_units: 32
  m_layers: 8
  adapter_dim: 128

  use_causal: true
  causal_recon_weight: 0.5
  causal_cf_weight: 0.3
  cf_hidden_dim: 2048
  cf_dropout: 0.1
  backdoor_smoothing: 1.0

train:
  dataset: ut-zap50k
  step_size: 5
  gamma: 0.5
  lr: 0.0001
  train_batch_size: 64
  epochs: 15
  context_length: 8
  seed: 0
  val_metric: AUC
  save_final_model: True
  save_path: output/ut
  att_loss_weight: 0.5
  obj_loss_weight: 0.5
  com_loss_weight: 1
  glb_loss_weight: 1

test:
  open_world: false
  eval_batch_size: 64
  feasibility: feasibilities/feasibility_zp.pt
  threshold: null
  threshold_trials: 50
  beta: 0.85
  load_model: false
